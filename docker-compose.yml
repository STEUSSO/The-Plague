services:
  plague-bot:
    build: .
    image: the-plague-bot:latest
    container_name: the-plague-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: keys.env
        required: false
    environment:
      - TOKEN=${TOKEN:-}
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
